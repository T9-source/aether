name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: TypeScript bindings freshness (ADR-002)
        run: |
          cargo test -p aether-core --test ts_bindings
          git diff --exit-code crates/aether-core/bindings || {
            echo "::error::TS bindings are stale — run cargo test and commit";
            exit 1;
          }
