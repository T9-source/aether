version: 2
updates:
  # Rust workspace + lockfile
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # Fuzzing crate has its own lockfile
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Console UI
  - package-ecosystem: npm
    directory: /apps/aether-ui
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # GitHub Actions themselves ( supply-chain hygiene )
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
