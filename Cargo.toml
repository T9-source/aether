[workspace]
resolver = "2"
members = [
    "crates/aether-core",
    "crates/aether-http",
    "crates/aether-store-sqlite",
    "crates/aether-daemon",
    "apps/aether-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["smart-jemy"]
repository = "https://github.com/smart-jemy/aether"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal", "fs"] }
base64 = "0.22"
ts-rs = { version = "10", features = ["serde-json-impl", "serde-compat"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
toml = "0.8"
# --- network stack (ADR-009): rustls + rcgen, hand-rolled h1 codec (wire truth) ---
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
webpki-roots = "0.26"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
time = "0.3"
# --- control plane (ADR-002): WebSocket + JSON ---
tokio-tungstenite = "0.24"
# --- storage (ADR-005): SQLite via sqlx, runtime API (no macros) ---
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
dirs = "5"
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
